<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="UST Network">
  <defs>
    <radialGradient id="bg" cx="45%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#111d52"/>
      <stop offset="100%" stop-color="#04060e"/>
    </radialGradient>

    <!-- Metallic silver gradient for U -->
    <linearGradient id="umetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#f0f4ff"/>
      <stop offset="35%"  stop-color="#d0d8f0"/>
      <stop offset="75%"  stop-color="#9aaace"/>
      <stop offset="100%" stop-color="#7888b0"/>
    </linearGradient>

    <!-- Edge highlight on U arms -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold border -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffd84d"/>
      <stop offset="45%"  stop-color="#fff0a0"/>
      <stop offset="75%"  stop-color="#c8880a"/>
      <stop offset="100%" stop-color="#ffd84d"/>
    </linearGradient>

    <!-- String: teal to blue -->
    <linearGradient id="str" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4aa" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#00d4aa"/>
      <stop offset="55%"  stop-color="#00f0cc"/>
      <stop offset="80%"  stop-color="#00bce0"/>
      <stop offset="100%" stop-color="#0090cc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pod gradient -->
    <linearGradient id="pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#aaffee"/>
      <stop offset="100%" stop-color="#009988"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-80%" y="-500%" width="260%" height="1100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Subtle noise/depth -->
  <rect width="128" height="128" rx="22" fill="none"
        stroke="rgba(255,255,255,0.04)" stroke-width="8"/>

  <!-- Gold border (outer) -->
  <rect x="2" y="2" width="124" height="124" rx="21"
        fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- Gold border (inner thin line) -->
  <rect x="6" y="6" width="116" height="116" rx="17.5"
        fill="none" stroke="rgba(255,220,80,0.18)" stroke-width="1"/>

  <!-- ══ U letter — built as a path for clean curves ══ -->
  <path d="
    M 28 20
    L 28 72
    Q 28 102 64 102
    Q 100 102 100 72
    L 100 20
    L 82 20
    L 82 70
    Q 82 86 64 86
    Q 46 86 46 70
    L 46 20
    Z"
    fill="url(#umetal)"/>

  <!-- Left-edge highlight -->
  <path d="M 28 20 L 28 72 Q 28 86 36 93 L 36 20 Z"
        fill="url(#highlight)" opacity="0.5"/>

  <!-- Top-face bevel on left arm -->
  <rect x="28" y="20" width="18" height="4" rx="1.5"
        fill="rgba(255,255,255,0.45)"/>
  <!-- Top-face bevel on right arm -->
  <rect x="82" y="20" width="18" height="4" rx="1.5"
        fill="rgba(255,255,255,0.25)"/>

  <!-- Inner shadow (depth of U bowl) -->
  <path d="M 46 70 Q 46 84 64 84 Q 82 84 82 70"
        stroke="rgba(0,0,0,0.4)" stroke-width="2.5" fill="none"/>


  <!-- ══ "ST" label ══ -->
  <text x="64" y="119"
        text-anchor="middle"
        font-family="'Arial Black',Arial,sans-serif"
        font-size="11.5" font-weight="900" letter-spacing="2"
        fill="#00e8c8">ST</text>
</svg>
