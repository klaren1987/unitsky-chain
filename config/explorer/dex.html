<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="UST DEX — swap UST and USDT on Chain 778889. Uniswap V2 compatible decentralised exchange.">
  <meta property="og:title" content="UST DEX — Swap on Chain 778889">
  <meta property="og:description" content="Swap UST ↔ USDT on the UST Network EVM network.">
  <meta property="og:image" content="https://147-45-143-23.sslip.io/icon.svg">
  <meta property="og:url" content="https://147-45-143-23.sslip.io/dex">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://147-45-143-23.sslip.io/dex">
  <title>UST DEX — Swap</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --accent: #d4a017; --accent2: #f0c040;
      --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent2); letter-spacing: 0.5px; }
    .logo span { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
    nav a:hover, nav a.active { color: var(--text); }
    #connectBtn {
      background: var(--accent); color: #000; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }
    #connectBtn:hover { background: var(--accent2); }
    #walletInfo { font-size: 0.82rem; color: var(--muted); }

    main { max-width: 460px; margin: 40px auto; padding: 0 16px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px;
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .slippage-label { font-size: 0.75rem; color: var(--muted); }

    .swap-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 4px;
    }
    .swap-box label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 8px; }
    .swap-row { display: flex; align-items: center; gap: 12px; }
    .swap-row input {
      flex: 1; background: transparent; border: none; font-size: 1.5rem;
      color: var(--text); outline: none; min-width: 0;
    }
    .swap-row input::placeholder { color: var(--border); }
    .token-badge {
      background: var(--border); border-radius: 8px; padding: 6px 12px;
      font-weight: 600; font-size: 0.9rem; white-space: nowrap; color: var(--text);
    }
    .bal { font-size: 0.75rem; color: var(--muted); margin-top: 6px; text-align: right; }
    .bal span { color: var(--accent2); cursor: pointer; text-decoration: underline dotted; }

    .arrow-btn {
      display: block; margin: 4px auto; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 1rem;
      color: var(--muted); transition: color .2s, transform .15s;
    }
    .arrow-btn:hover { color: var(--text); transform: rotate(180deg); }

    #priceInfo { font-size: 0.82rem; color: var(--muted); margin: 10px 0; padding: 0 4px; min-height: 18px; }

    #swapBtn {
      width: 100%; padding: 14px; background: var(--accent); color: #000;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 12px; transition: background .2s;
    }
    #swapBtn:hover:not(:disabled) { background: var(--accent2); }
    #swapBtn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

    #status { margin-top: 12px; font-size: 0.85rem; min-height: 20px; text-align: center; }
    .ok { color: var(--green); } .err { color: var(--red); } .info { color: var(--muted); }

    .approve-notice { font-size: 0.78rem; color: var(--muted); margin-top: 6px; text-align: center; min-height: 16px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .stat-val.price { color: var(--accent2); }

    .gecko-link { text-align: center; margin-top: 16px; font-size: 0.72rem; color: var(--muted); }
    .gecko-link a { color: var(--muted); }

    @media (max-width: 480px) {
      header { padding: 12px 16px; }
      main { margin: 20px auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">UST DEX <span>Chain 778889</span></div>
  <nav>
    <a href="/">Explorer</a>
    <a href="/dex" class="active">Swap</a>
    <a href="/faucet">Faucet</a>
    <a href="/bridge">Bridge</a>
  </nav>
  <div>
    <button id="connectBtn">Connect Wallet</button>
    <div id="walletInfo"></div>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Swap</span>
      <span class="slippage-label">Slippage: 0.5%</span>
    </div>

    <div class="swap-box">
      <label>You pay</label>
      <div class="swap-row">
        <input id="fromAmt" type="number" placeholder="0.0" min="0" step="any" />
        <div class="token-badge" id="fromToken">UST</div>
      </div>
      <div class="bal">Balance: <span id="fromBal" onclick="setMax()" title="Click to set max">—</span></div>
    </div>

    <button class="arrow-btn" onclick="flipTokens()" title="Flip tokens">⇅</button>

    <div class="swap-box">
      <label>You receive (estimated)</label>
      <div class="swap-row">
        <input id="toAmt" type="number" placeholder="0.0" readonly tabindex="-1" />
        <div class="token-badge" id="toToken">USDT</div>
      </div>
    </div>

    <div id="priceInfo"></div>
    <button id="swapBtn" disabled onclick="doSwap()">Connect wallet first</button>
    <div class="approve-notice" id="approveNote"></div>
    <div id="status"></div>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="stat-label">UST Price</div><div class="stat-val price" id="statPrice">…</div></div>
    <div class="stat"><div class="stat-label">Pool TVL</div><div class="stat-val" id="statTvl">…</div></div>
    <div class="stat"><div class="stat-label">UST Reserve</div><div class="stat-val" id="statUst">…</div></div>
    <div class="stat"><div class="stat-label">USDT Reserve</div><div class="stat-val" id="statUsdt">…</div></div>
  </div>

  <div class="gecko-link" id="geckolink" style="display:none">
    <a href="https://www.geckoterminal.com" target="_blank" rel="noopener">Powered by GeckoTerminal</a>
  </div>
</main>

<footer style="margin-top:32px;text-align:center;font-size:0.8rem;color:var(--muted);padding-bottom:32px;">
  <a href="/" style="color:var(--muted);text-decoration:none;margin:0 8px;">Explorer</a>
  <a href="/dex" style="color:var(--muted);text-decoration:none;margin:0 8px;">DEX Swap</a>
  <a href="/bridge" style="color:var(--muted);text-decoration:none;margin:0 8px;">Bridge</a>
  <a href="/faucet" style="color:var(--muted);text-decoration:none;margin:0 8px;">Faucet</a>
  <a href="/rpc" style="color:var(--muted);text-decoration:none;margin:0 8px;">RPC</a>
  <a href="https://github.com/klaren1987/UST-chain" target="_blank" rel="noopener" style="color:var(--muted);text-decoration:none;margin:0 8px;">GitHub</a>
</footer>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const RPC      = "https://147-45-143-23.sslip.io/rpc";
const ROUTER   = "0xfd9B22033f1d5B1725D66d428F85bAa44EC5e848";
const WUST     = "0x372cf3bc672639f4089d493c3863933affd88014";
const USDT     = "0xcd7cb25f025B20D5f90C0FDA3463D91AF76A8EF1"; // BridgedUSDT 18 decimals
const PAIR     = "0x0f53baf46172bddf8004909d05e9ab8592ca08e7"; // WUST/bUSDT (token0=WUST, token1=bUSDT)
const CHAIN_ID = "0xBE289";
const SLIPPAGE = 0.005; // 0.5%

const ROUTER_ABI = [
  "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) payable returns (uint[] memory)",
  "function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) returns (uint[] memory)",
  "function getAmountsOut(uint amountIn, address[] calldata path) view returns (uint[] memory)",
];
const ERC20_ABI = [
  "function balanceOf(address) view returns (uint)",
  "function allowance(address,address) view returns (uint)",
  "function approve(address,uint) returns (bool)",
];
const PAIR_ABI = [
  "function getReserves() view returns (uint112,uint112,uint32)",
  "function token0() view returns (address)",
];

// ─── State ────────────────────────────────────────────────────────────────────
let provider, signer, account;
let fromUST = true;
let ustBal = 0n, usdtBal = 0n;
let poolReserveUst = 0n, poolReserveUsdt = 0n; // cached for impact calc
let refreshTimer = null;

// Cached read-only provider (reused, not recreated per call)
const readProvider = new ethers.JsonRpcProvider(RPC);

const $ = id => document.getElementById(id);

// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmt18(wei) {
  // Use ethers for precision, then trim trailing zeros
  return parseFloat(ethers.formatEther(wei)).toLocaleString("en", {maximumFractionDigits: 4});
}
function fmt18usdt(u) {
  return parseFloat(ethers.formatEther(u)).toLocaleString("en", {maximumFractionDigits: 2});
}

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = "";                    // clear first (no innerHTML = no XSS)
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = msg;
  el.appendChild(span);
}

function setApproveNote(msg) {
  $("approveNote").textContent = msg;
}

// ─── Wallet ───────────────────────────────────────────────────────────────────
async function connectWallet() {
  if (!window.ethereum) { setStatus("MetaMask not found", "err"); return; }
  try {
    await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{chainId: CHAIN_ID}] });
  } catch(e) {
    if (e.code === 4902 || e.code === -32603) {
      try {
        await window.ethereum.request({
          method: "wallet_addEthereumChain",
          params: [{ chainId: CHAIN_ID, chainName: "UST Network",
            nativeCurrency: {name:"UST", symbol:"UST", decimals:18},
            rpcUrls: [RPC], blockExplorerUrls: ["https://147-45-143-23.sslip.io"] }]
        });
      } catch(e2) { setStatus("Failed to add network: " + (e2.message || e2), "err"); return; }
    } else if (e.code !== 4001) {
      setStatus("Network switch error: " + (e.message || e), "err"); return;
    } else { return; } // user rejected
  }

  let accounts;
  try {
    accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  } catch(e) { setStatus("Wallet connection rejected", "err"); return; }

  account = accounts[0];
  provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  $("connectBtn").textContent = account.slice(0,6) + "…" + account.slice(-4);
  $("swapBtn").disabled = false;
  $("swapBtn").textContent = "Swap";
  setStatus("", "");
  await refreshBalances();
  await refreshPool();
}

// Listen for MetaMask events
if (window.ethereum) {
  window.ethereum.on("accountsChanged", accs => {
    if (accs.length === 0) {
      account = null; signer = null;
      $("connectBtn").textContent = "Connect Wallet";
      $("swapBtn").disabled = true;
      $("swapBtn").textContent = "Connect wallet first";
      $("fromBal").textContent = "—";
      ustBal = 0n; usdtBal = 0n;
    } else { account = accs[0]; $("connectBtn").textContent = account.slice(0,6)+"…"+account.slice(-4); refreshBalances(); }
  });
  window.ethereum.on("chainChanged", () => window.location.reload());
}

// ─── Balances ─────────────────────────────────────────────────────────────────
async function refreshBalances() {
  if (!account || !provider) return;
  try {
    ustBal = await provider.getBalance(account);
    const usdtContract = new ethers.Contract(USDT, ERC20_ABI, provider);
    usdtBal = await usdtContract.balanceOf(account);
    updateBalDisplay();
  } catch(e) { /* network hiccup — ignore */ }
}

function updateBalDisplay() {
  $("fromBal").textContent = fromUST
    ? fmt18(ustBal) + " UST"
    : fmt18usdt(usdtBal) + " USDT";
}

// ─── Pool ─────────────────────────────────────────────────────────────────────
async function refreshPool() {
  try {
    const pair = new ethers.Contract(PAIR, PAIR_ABI, readProvider);
    const [r0, r1] = await pair.getReserves();
    const token0 = (await pair.token0()).toLowerCase();
    const isUsdt0 = token0 === USDT.toLowerCase();
    const usdtR = isUsdt0 ? r0 : r1;
    const wustR = isUsdt0 ? r1 : r0;
    poolReserveUsdt = usdtR;
    poolReserveUst  = wustR;
    const usdtF = Number(ethers.formatEther(usdtR));
    const wustF = Number(ethers.formatEther(wustR));
    const price = usdtF / wustF;
    const tvl = usdtF * 2;
    $("statPrice").textContent = "$" + price.toFixed(6);
    $("statTvl").textContent   = "$" + tvl.toFixed(2);
    $("statUst").textContent   = wustF.toLocaleString("en", {maximumFractionDigits:2}) + " UST";
    $("statUsdt").textContent  = usdtF.toLocaleString("en", {maximumFractionDigits:2}) + " USDT";
    $("geckolink").style.display = "block";
  } catch(e) {
    $("statPrice").textContent = "—";
    $("statTvl").textContent   = "—";
  }
}

// Auto-refresh pool every 15 seconds
function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async () => {
    await refreshPool();
    if (account) await refreshBalances();
  }, 15000);
}

// ─── Quote ────────────────────────────────────────────────────────────────────
async function calcOut() {
  const raw = $("fromAmt").value;
  const amt = parseFloat(raw);
  if (!raw || !isFinite(amt) || amt <= 0) {
    $("toAmt").value = "";
    $("priceInfo").textContent = "";
    return;
  }

  const router = new ethers.Contract(ROUTER, ROUTER_ABI, readProvider);
  try {
    let amtIn, path, outDecimals;
    if (fromUST) {
      amtIn = ethers.parseEther(String(amt));
      path = [WUST, USDT];
    } else {
      amtIn = ethers.parseEther(String(amt));
      path = [USDT, WUST];
    }
    const amounts = await router.getAmountsOut(amtIn, path);
    const outRaw = amounts[1];
    const outF = Number(ethers.formatEther(outRaw));
    $("toAmt").value = outF.toFixed(4);

    // Real price impact using Uniswap V2 formula
    const impact = calcPriceImpact(amtIn, path);
    const pricePerUST = fromUST ? outF/amt : amt/outF;
    $("priceInfo").textContent =
      `1 UST ≈ ${pricePerUST.toFixed(6)} USDT  ·  Price impact: ${impact.toFixed(2)}%`;
  } catch(e) {
    $("toAmt").value = "";
    $("priceInfo").textContent = "Quote error: " + (e.reason || e.message || e);
  }
}

function calcPriceImpact(amtIn, path) {
  // Uniswap V2 formula: impact = amtIn / (reserveIn + amtIn) * 100
  if (!poolReserveUst || !poolReserveUsdt) return 0;
  const isUSTin = path[0].toLowerCase() === WUST.toLowerCase();
  const reserveIn = isUSTin ? Number(ethers.formatEther(poolReserveUst)) : Number(ethers.formatEther(poolReserveUsdt));
  const amtInF    = isUSTin ? Number(ethers.formatEther(amtIn)) : Number(ethers.formatEther(amtIn));
  return Math.min((amtInF / (reserveIn + amtInF)) * 100, 99);
}

function setMax() {
  if (fromUST) {
    // Leave ~0.01 UST for gas
    const maxWei = ustBal > ethers.parseEther("0.01") ? ustBal - ethers.parseEther("0.01") : 0n;
    $("fromAmt").value = parseFloat(ethers.formatEther(maxWei)).toFixed(6);
  } else {
    $("fromAmt").value = parseFloat(ethers.formatEther(usdtBal)).toFixed(6);
  }
  calcOut();
}

function flipTokens() {
  fromUST = !fromUST;
  $("fromToken").textContent = fromUST ? "UST" : "USDT";
  $("toToken").textContent   = fromUST ? "USDT" : "UST";
  $("fromAmt").value = ""; $("toAmt").value = "";
  $("priceInfo").textContent = "";
  updateBalDisplay();
}

// ─── Swap ─────────────────────────────────────────────────────────────────────
async function doSwap() {
  if (!signer) { connectWallet(); return; }
  const raw = $("fromAmt").value;
  const amt = parseFloat(raw);
  if (!raw || !isFinite(amt) || amt <= 0) { setStatus("Enter a valid amount", "err"); return; }

  const deadline = Math.floor(Date.now()/1000) + 600;
  const router = new ethers.Contract(ROUTER, ROUTER_ABI, signer);

  $("swapBtn").disabled = true;
  $("swapBtn").textContent = "Swapping…";
  setStatus("Preparing…", "info");
  setApproveNote("");

  try {
    let tx;
    if (fromUST) {
      const amtIn = ethers.parseEther(String(amt));
      const amounts = await router.getAmountsOut(amtIn, [WUST, USDT]);
      const minOut = amounts[1] * BigInt(Math.floor((1 - SLIPPAGE) * 10000)) / 10000n;
      setStatus("Confirm in MetaMask…", "info");
      tx = await router.swapExactETHForTokens(minOut, [WUST, USDT], account, deadline, { value: amtIn });
    } else {
      const amtIn = ethers.parseEther(String(amt));
      const usdtContract = new ethers.Contract(USDT, ERC20_ABI, signer);
      const allowance = await usdtContract.allowance(account, ROUTER);
      if (allowance < amtIn) {
        setStatus("Step 1/2 — Approve USDT…", "info");
        setApproveNote("Confirm approval in MetaMask");
        const aTx = await usdtContract.approve(ROUTER, ethers.MaxUint256);
        setApproveNote("Waiting for approval confirmation…");
        await aTx.wait();
        setApproveNote("");
      }
      const amounts = await router.getAmountsOut(amtIn, [USDT, WUST]);
      const minOut = amounts[1] * BigInt(Math.floor((1 - SLIPPAGE) * 10000)) / 10000n;
      setStatus("Step 2/2 — Confirm swap in MetaMask…", "info");
      tx = await router.swapExactTokensForETH(amtIn, minOut, [USDT, WUST], account, deadline);
    }

    setStatus("Waiting for confirmation…", "info");
    const receipt = await tx.wait();
    setStatus("✓ Swapped! tx: " + receipt.hash.slice(0,10) + "…", "ok");
    $("fromAmt").value = ""; $("toAmt").value = "";
    $("priceInfo").textContent = "";
    await refreshBalances();
    await refreshPool();
  } catch(e) {
    const msg = e.reason || e.shortMessage || e.message || String(e);
    setStatus("Error: " + msg.slice(0, 120), "err");
  } finally {
    $("swapBtn").disabled = false;
    $("swapBtn").textContent = "Swap";
    setApproveNote("");
  }
}

// ─── Input guard: block negative, block leading zeros ────────────────────────
$("fromAmt").addEventListener("input", () => {
  const v = parseFloat($("fromAmt").value);
  if ($("fromAmt").value !== "" && (isNaN(v) || v < 0)) $("fromAmt").value = "";
  calcOut();
});
$("fromAmt").addEventListener("keydown", e => {
  if (e.key === "-" || e.key === "e") e.preventDefault();
});

$("connectBtn").addEventListener("click", connectWallet);

// ─── Boot ─────────────────────────────────────────────────────────────────────
window.addEventListener("load", async () => {
  await refreshPool();
  startAutoRefresh();
  if (window.ethereum?.selectedAddress) connectWallet();
});
</script>
</body>
</html>
