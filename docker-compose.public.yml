# Public HTTPS RPC + block explorer.
# Run on the node host after docker-compose.windows-node.yml (or docker-compose.node.yml) is up.
#
# Usage:
#   docker compose -f docker-compose.public.yml up -d

services:
  rpc-filter:
    build:
      context: .
      dockerfile: docker/rpc-filter.Dockerfile
    image: tebot-rpc-filter
    container_name: unitsky-string-rpc-filter
    restart: unless-stopped
    environment:
      GETH_URL: http://unitsky-string-node:8545
      GETH_WS_URL: ws://unitsky-string-node:8546
      RPC_FILTER_PORT: "8547"
      RPC_FILTER_WS_PORT: "8548"
      USST_CHAIN_ID: ${USST_CHAIN_ID:-778889}
      USST_FAUCET_KEY: ${USST_FAUCET_KEY:-}
      USST_FAUCET_AMOUNT: ${USST_FAUCET_AMOUNT:-0.01}
      USST_FAUCET_COOLDOWN: ${USST_FAUCET_COOLDOWN:-86400}
      USST_FAUCET_MAX_BALANCE: ${USST_FAUCET_MAX_BALANCE:-0.1}
      BRIDGE_TREASURY_ADDRESS: ${BRIDGE_TREASURY_ADDRESS:-}
      BRIDGED_USDT_ADDRESS: ${BRIDGED_USDT_ADDRESS:-}
      BRIDGE_OPERATOR_KEY: ${BRIDGE_OPERATOR_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8547', timeout=2)\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - tebot_default

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    image: caddy-timeweb:latest
    container_name: unitsky-string-caddy
    restart: unless-stopped
    environment:
      TIMEWEB_API_TOKEN: ${TIMEWEB_API_TOKEN}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/byteboost-sites.caddy:/etc/caddy/byteboost-sites.caddy:ro
      - ./config/caddy/static:/srv/static:ro
      - ./config/explorer:/srv/explorer:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tebot_default

  bridge-relayer:
    build:
      context: .
      dockerfile: docker/rpc-filter.Dockerfile
    image: tebot-rpc-filter
    container_name: unitsky-string-bridge-relayer
    restart: unless-stopped
    command: python /app/scripts/bridge-relayer.py
    environment:
      BRIDGE_OPERATOR_KEY: ${BRIDGE_OPERATOR_KEY:-}
      BRIDGED_USDT_ADDRESS: ${BRIDGED_USDT_ADDRESS:-}
      ETH_RPC: ${ETH_RPC:-https://ethereum.publicnode.com}
      BRIDGE_TREASURY_ADDRESS: ${BRIDGE_TREASURY_ADDRESS:-}
      USST_RPC: http://unitsky-string-node:8545
      BRIDGE_MIN_USDT: ${BRIDGE_MIN_USDT:-1.0}
      BRIDGE_MAX_USDT: ${BRIDGE_MAX_USDT:-10000.0}
      BRIDGE_RATE_LIMIT: ${BRIDGE_RATE_LIMIT:-5}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./logs:/app/logs
    networks:
      - tebot_default
    depends_on:
      - rpc-filter

  pool-watchdog:
    build:
      context: .
      dockerfile: docker/rpc-filter.Dockerfile
    image: tebot-rpc-filter
    container_name: unitsky-string-pool-watchdog
    restart: unless-stopped
    command: python /app/scripts/pool-watchdog.py
    environment:
      USST_RPC: http://unitsky-string-node:8545
      USST_CHAIN_ID: ${USST_CHAIN_ID:-778889}
      USST_CONTRACT_ADDRESS: ${USST_CONTRACT_ADDRESS:-}
      USST_DEPLOYER_KEY: ${USST_DEPLOYER_KEY:-}
      POOL_MIN_UST: ${POOL_MIN_UST:-1000}
      POOL_REFILL_UST: ${POOL_REFILL_UST:-5000}
      POOL_CHECK_INTERVAL: ${POOL_CHECK_INTERVAL:-60}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./logs:/app/logs
    networks:
      - tebot_default
    depends_on:
      - rpc-filter

networks:
  tebot_default:
    external: true

volumes:
  caddy_data:
  caddy_config:
